<!--6 dữ liệu -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liên hệ — VíThôngMinh</title>
    <link rel="stylesheet" href="./dist/output.css" />
</head>
<body class="bg-surface font-body text-ink antialiased dark:bg-surface-dark dark:text-ink-invert">

     
    <header class="sticky top-0 z-40 border-b border-line bg-surface/85 backdrop-blur dark:border-line-invert dark:bg-surface-dark/85">
        <nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
            <a href="./index.html" class="flex items-center gap-2.5">
                <span class="grid h-9 w-9 place-items-center rounded-lg bg-brand-600 font-display text-lg font-extrabold text-white">V</span>
                <span class="font-display text-xl font-extrabold text-ink dark:text-white">VíThôngMinh</span>
            </a>
            <a href="./index.html" class="text-sm font-medium hover:text-brand-600">Quay lại trang chủ</a>
        </nav>
    </header>

    <main id="main">
        <section class="section max-w-3xl" aria-labelledby="contact-title">
            <div class="text-center">
                <p class="eyebrow">Hỗ trợ khách hàng</p>
                <h1 id="contact-title" class="mt-3 font-display text-3xl font-extrabold text-ink sm:text-4xl dark:text-white">
                    Gửi yêu cầu cho chúng tôi
                </h1>
                <p class="mt-4 text-muted">Đội ngũ VíThôngMinh sẽ phản hồi bạn trong vòng 24 giờ làm việc.</p>
            </div>

            <!-- FORM  -->
            <form action="#" method="POST" class="card mt-12 grid gap-6 shadow-lg">
                
                <div class="grid gap-6 md:grid-cols-2">
                    <!-- 1. Họ tên -->
                    <div>
                        <label class="field-label" for="ho-ten">Họ và tên</label>
                        <input class="field-input" id="ho-ten" name="hoTen" type="text" required autocomplete="name" />
                    </div>

                    <!-- 2. Email -->
                    <div>
                        <label class="field-label" for="email">Email liên hệ</label>
                        <input class="field-input" id="email" name="email" type="email" required autocomplete="email" />
                    </div>
                </div>

                <!-- 3. Số điện thoại -->
                <div>
                    <label class="field-label" for="dien-thoai">
                        Số điện thoại <span class="text-red-600" aria-hidden="true">*</span>
                    </label>
                    <input class="field-input" id="dien-thoai" name="dienThoai" type="tel" required
                           pattern="0[10-18]{9}" autocomplete="tel" inputmode="numeric"
                           aria-describedby="dien-thoai-hint dien-thoai-error" />
                    <p class="mt-1.5 text-xs text-muted" id="dien-thoai-hint">
                        Chúng tôi gọi qua số này để hỗ trợ kỹ thuật, không quảng cáo [8].
                    </p>
                    <p class="field-error" id="dien-thoai-error" role="alert"></p>
                </div>

                <!-- 4. Chủ đề  -->
                <div>
                    <label class="field-label" for="chu-de">Vấn đề cần hỗ trợ</label>
                    <select class="field-input cursor-pointer" id="chu-de" name="chuDe">
                        <option value="ky-thuat">Lỗi ứng dụng / Kỹ thuật</option>
                        <option value="thanh-toan">Gói cước / Thanh toán</option>
                        <option value="gop-y">Góp ý tính năng mới</option>
                        <option value="khac">Khác</option>
                    </select>
                </div>

                <!-- 5.Nội dung  -->
                <div>
                    <label class="field-label" for="noi-dung">Nội dung tin nhắn</label>
                    <textarea class="field-input min-h-[120px]" id="noi-dung" name="noiDung" required></textarea>
                </div>

                <!-- 6. Đồng ý -->
                <div class="flex items-start gap-3">
                    <input type="checkbox" id="dong-y" name="dongY" required 
                           class="mt-1 h-4 w-4 cursor-pointer rounded border-line text-brand-600 focus:ring-brand-600" />
                    <label class="text-sm text-muted cursor-pointer" for="dong-y">
                        Tôi đồng ý với <a href="#" class="text-brand-600 underline">Chính sách bảo mật</a> của VíThôngMinh.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-full py-4 text-base">
                    Gửi tin nhắn ngay
                </button>
            </form>
        </section>
    </main>


    <footer class="border-t border-line bg-white py-12 text-sm text-muted dark:border-line-invert dark:bg-slate-900">
        <div class="mx-auto max-w-6xl px-5 text-center">
            <p>© PHẠM HUỲNH PHƯỚC - ĐẠI HỌC MỞ.</p>
        </div>
    </footer>

</body>
</html>
